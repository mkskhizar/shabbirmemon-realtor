<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Estates - Premium Real Estate in Pakistan</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
tailwind.config = {
theme: {
extend: {
colors: {
primary: '#1e293b',
accent: '#ca8a04',
secondary: '#64748b',
},
fontFamily: {
sans: ['Inter', 'sans-serif'],
serif: ['Playfair Display', 'serif'],
}
}
}
}
</script>

<style>
body { scroll-behavior: smooth; }
.property-card { transition: all 0.3s ease; }
.property-card:hover { transform: translateY(-5px); }
.img-container { overflow: hidden; }
.img-container img { transition: transform 0.5s ease; }
.property-card:hover .img-container img { transform: scale(1.05); }
.city-tab.active { background:white; color:#1e293b; }
.filter-btn.active { background:#1e293b; color:white; }
.mode-btn.active { background:#ca8a04; color:white; }
</style>
</head>

<body class="bg-slate-50 text-slate-800">

<nav class="bg-primary text-white p-4">Prime Estates</nav>

<header class="relative h-[500px] flex items-center justify-center">
<div id="hero-bg" class="absolute inset-0">
<img src="https://images.unsplash.com/photo-1580674285054-bed31e145f59?auto=format&fit=crop&q=80&w=2070" class="w-full h-full object-cover brightness-50">
</div>

<div class="relative text-center text-white">
<h1 class="text-4xl font-bold">
Find Your Dream Space in <span id="hero-city-name">Karachi</span>
</h1>

<div>
<button onclick="switchCity('Karachi')" id="tab-karachi" class="city-tab active">Karachi</button>
<button onclick="switchCity('Islamabad')" id="tab-islamabad" class="city-tab">Islamabad</button>
</div>
</div>
</header>

<main class="p-6">

<div>
<button onclick="setMode('sale')" id="mode-sale" class="mode-btn active">Sale</button>
<button onclick="setMode('rent')" id="mode-rent" class="mode-btn">Rent</button>
</div>

<div>
<button onclick="setCategory('all')" id="cat-all" class="filter-btn active">All</button>
<button onclick="setCategory('house')" id="cat-house">House</button>
<button onclick="setCategory('apartment')" id="cat-apartment">Apartment</button>
<button onclick="setCategory('commercial')" id="cat-commercial">Commercial</button>
</div>

<h2 id="listing-title"></h2>
<p id="listing-count"></p>

<div id="property-grid"></div>
<div id="empty-state" class="hidden">No properties found</div>

</main>

<script>
const properties = [
{ id:1, city:'Karachi', mode:'sale', type:'house', title:'Luxury DHA Bungalow', location:'DHA Phase 8', price:'PKR 12.5 Crore', beds:5, baths:6, area:'500 Sq Yd', image:'https://images.unsplash.com/photo-1613977257363-707ba9348227?auto=format&fit=crop&q=80&w=800' }
];

let state = { city:'Karachi', mode:'sale', category:'all' };

function switchCity(cityName){
state.city = cityName;

document.querySelectorAll('.city-tab').forEach(el=>{
el.classList.remove('active');
});

document.getElementById(`tab-${cityName.toLowerCase()}`).classList.add('active');

document.getElementById('hero-city-name').textContent = cityName;

renderProperties();
}

function setMode(mode){
state.mode = mode;

document.querySelectorAll('.mode-btn').forEach(btn=>{
btn.classList.remove('active');
});

document.getElementById(`mode-${mode}`).classList.add('active');

renderProperties();
}

function setCategory(cat){
state.category = cat;

document.querySelectorAll('.filter-btn').forEach(btn=>{
btn.classList.remove('active');
});

document.getElementById(`cat-${cat}`).classList.add('active');

renderProperties();
}

function renderProperties(){
const grid = document.getElementById('property-grid');
const title = document.getElementById('listing-title');
const count = document.getElementById('listing-count');

const filtered = properties.filter(p =>
p.city===state.city &&
p.mode===state.mode &&
(state.category==='all'||p.type===state.category)
);

title.textContent = `${state.category==='all'?'Properties':state.category} for ${state.mode} in ${state.city}`;
count.textContent = `${filtered.length} listings`;

grid.innerHTML='';

if(filtered.length===0){
document.getElementById('empty-state').classList.remove('hidden');
return;
}

filtered.forEach(p=>{
const card = document.createElement('div');

card.innerHTML = `
<div class="property-card">
<img src="${p.image}" width="300">
<h3>${p.title}</h3>
<p>${p.location}</p>
<p>${p.price}</p>
</div>
`;

grid.appendChild(card);
});
}

document.addEventListener('DOMContentLoaded', renderProperties);
</script>

</body>
</html>
