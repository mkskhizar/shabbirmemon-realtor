<script>
    // ── PAGE LOAD ANIMATION ──
    window.addEventListener('load', () => {
        document.body.classList.add('loaded');
    });

    // ── MOBILE MENU ──
    document.getElementById('mobile-menu-btn').addEventListener('click', () => {
        document.getElementById('mobile-menu').classList.toggle('hidden');
    });

    // ── FIXED CITY SHOW/HIDE ──
    function showCity(city) {

        const isbSection  = document.getElementById('section-islamabad');
        const khiSection  = document.getElementById('section-karachi');
        const placeholder = document.getElementById('city-placeholder');
        const tabRow      = document.getElementById('city-tab-row');
        const tabIsb      = document.getElementById('tab-isb');
        const tabKhi      = document.getElementById('tab-khi');

        // hide placeholder
        placeholder.style.display = 'none';

        // show tabs
        tabRow.classList.remove('hidden');

        // RESET BOTH SECTIONS
        isbSection.classList.remove('visible');
        khiSection.classList.remove('visible');

        isbSection.style.display = 'none';
        khiSection.style.display = 'none';

        // SHOW SELECTED CITY
        if (city === 'islamabad') {

            isbSection.style.display = 'block';

            setTimeout(() => {
                isbSection.classList.add('visible');
            }, 10);

            tabIsb.classList.add('active');
            tabKhi.classList.remove('active');

        } else {

            khiSection.style.display = 'block';

            setTimeout(() => {
                khiSection.classList.add('visible');
            }, 10);

            tabKhi.classList.add('active');
            tabIsb.classList.remove('active');
        }

        // smooth scroll
        setTimeout(() => {
            document.getElementById('properties')
                .scrollIntoView({ behavior: 'smooth' });
        }, 100);
    }

    // ── MODAL OPEN ──
    function openModal(data) {
        document.getElementById('modal-img').src       = data.img;
        document.getElementById('modal-img').alt       = data.title;
        document.getElementById('modal-badge').textContent  = data.badge;
        document.getElementById('modal-price').textContent  = data.price;
        document.getElementById('modal-title').textContent  = data.title;
        document.getElementById('modal-details').textContent = data.details;

        document.getElementById('modal-city-tag').innerHTML =
            '<i class="fas fa-map-marker-alt mr-1"></i>' + data.city;

        document.getElementById('modal-wa-btn').href =
            'https://wa.me/923332964231?text=' +
            encodeURIComponent(data.waMsg);

        const modal = document.getElementById('detail-modal');

        modal.classList.add('open');

        document.body.style.overflow = 'hidden';
    }

    // ── MODAL CLOSE ──
    function closeModal() {
        document.getElementById('detail-modal').classList.remove('open');
        document.body.style.overflow = '';
    }

    // close on backdrop click
    function handleModalClick(e) {
        if (e.target === document.getElementById('detail-modal')) {
            closeModal();
        }
    }

    // close on ESC
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            closeModal();
        }
    });
</script>
