        :root {
            --primary:   #002b5c;
            --secondary: #15727a;
            --accent:    #e63946;
            --gold:      #c9a84c;
            --bg:        #f3f6f9;
            --card:      #ffffff;
            --border:    #e4eaf0;
            --text:      #222;
            --muted:     #6b7280;
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        a { text-decoration: none; color: inherit; }

        /* ── NAV ── */
        .nav {
            position: sticky;
            top: 0;
            z-index: 200;
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 12px rgba(0,43,92,0.07);
        }
        .nav-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 68px;
        }
        .nav-brand { display: flex; align-items: center; gap: 10px; }
        .nav-brand img { height: 42px; }
        .nav-brand-text { display: flex; flex-direction: column; }
        .nav-brand-text span:first-child { font-weight: 800; color: var(--primary); font-size: 1rem; }
        .nav-brand-text span:last-child { font-size: 0.65rem; color: var(--secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
        .nav-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary);
            color: #fff;
            padding: 9px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        .nav-back:hover { background: var(--accent); }

        /* ── BREADCRUMB ── */
        .breadcrumb {
            max-width: 1280px;
            margin: 0 auto;
            padding: 14px 24px;
            font-size: 0.8rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .breadcrumb a { color: var(--secondary); }
        .breadcrumb a:hover { text-decoration: underline; }
        .breadcrumb i { font-size: 0.6rem; }

        /* ── PAGE LAYOUT ── */
        .page-wrap {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px 60px;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 28px;
            align-items: start;
        }
        @media (max-width: 900px) {
            .page-wrap { grid-template-columns: 1fr; }
            .sidebar { order: -1; }
        }

        /* ── MAIN COLUMN ── */
        .main-col { display: flex; flex-direction: column; gap: 24px; }

        /* ── PROPERTY HEADER ── */
        .prop-header {
            background: var(--card);
            border-radius: 14px;
            padding: 24px 28px;
            border: 1px solid var(--border);
        }
        .prop-badge-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .prop-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .badge-hot     { background: #fef3c7; color: #92400e; }
        .badge-sale    { background: #dbeafe; color: #1e40af; }
        .badge-comm    { background: #d1fae5; color: #065f46; }
        .badge-exc     { background: #ede9fe; color: #5b21b6; }
        .badge-new { background: #fee2e2; color: #991b1b; }

        .prop-title {
            font-size: clamp(1.2rem, 3vw, 1.75rem);
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 8px;
            line-height: 1.3;
        }
        .prop-location {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--secondary);
            font-size: 0.88rem;
            font-weight: 500;
        }
        .prop-price-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .prop-price {
            font-size: clamp(1.6rem, 4vw, 2.2rem);
            font-weight: 800;
            color: var(--primary);
        }
        .prop-stats { display: flex; gap: 20px; flex-wrap: wrap; }
        .stat-pill {
            display: flex;
            align-items: center;
            gap: 7px;
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text);
        }
        .stat-pill i { color: var(--secondary); font-size: 0.9rem; }

        /* ── GALLERY ── */
        .gallery-card {
            background: var(--card);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .gallery-main {
            position: relative;
            width: 100%;
            height: 420px;
            background: #111;
            overflow: hidden;
        }
        @media (max-width: 600px) { .gallery-main { height: 240px; } }

        .gallery-main img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.35s ease;
        }
        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.55);
            color: #fff;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
            z-index: 5;
        }
        .gallery-arrow:hover { background: var(--accent); }
        .gallery-arrow.left { left: 14px; }
        .gallery-arrow.right { right: 14px; }
        .gallery-counter {
            position: absolute;
            bottom: 14px;
            right: 14px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .gallery-thumbs {
            display: flex;
            gap: 8px;
            padding: 12px;
            overflow-x: auto;
            background: #f9fafb;
            border-top: 1px solid var(--border);
        }
        .gallery-thumbs::-webkit-scrollbar { height: 4px; }
        .gallery-thumbs::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }
        .thumb {
            flex-shrink: 0;
            width: 80px;
            height: 60px;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }
        .thumb.active { border-color: var(--secondary); }
        .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* ── OVERVIEW TABS ── */
        .tabs-bar {
            background: var(--card);
            border-radius: 14px;
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .tabs-nav {
            display: flex;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }
        .tabs-nav::-webkit-scrollbar { height: 0; }
        .tab-btn {
            flex-shrink: 0;
            padding: 14px 22px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            border: none;
            background: none;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--secondary); }
        .tab-btn:hover:not(.active) { color: var(--text); background: var(--bg); }
        .tab-content { padding: 28px; display: none; }
        .tab-content.active { display: block; }

        /* Overview tab */
        .details-label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--secondary);
            margin-bottom: 14px;
        }
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 28px;
        }
        .detail-row {
            display: contents;
        }
        .detail-row > div {
            padding: 12px 18px;
            font-size: 0.88rem;
            border-bottom: 1px solid var(--border);
        }
        .detail-row > div:nth-child(odd) {
            color: var(--muted);
            font-weight: 500;
            background: #f9fafb;
        }
        .detail-row > div:nth-child(even) {
            color: var(--text);
            font-weight: 600;
        }
        .detail-row:last-child > div { border-bottom: none; }

        /* Description */
        .desc-text {
            font-size: 0.92rem;
            line-height: 1.9;
            color: #444;
        }
        .desc-text p { margin-bottom: 14px; }
        .desc-text strong { color: var(--primary); }

        /* Features */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }
        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            background: var(--bg);
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text);
            border: 1px solid var(--border);
        }
        .feature-item i { color: var(--secondary); font-size: 1rem; width: 18px; text-align: center; }

        .sidebar { display: flex; flex-direction: column; gap: 20px; }

        .sidebar-sticky {

            flex-direction: column;
            gap: 20px;

        .contact-box {

            font-weight: 800;
            color: var(--primary);
            margin-bottom: 6px;
        }
        .contact-added {
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 20px;
        }

            align-items: center;

            gap: 10px;
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 10px;

            cursor: pointer;
            border: none;

        .btn-wa:hover { background: #128C7E; }
        .btn-call { background: var(--primary); color: #fff; }
        .btn-call:hover { background: var(--accent); }

            display: flex;
            align-items: center;
            gap: 10px;
            margin: 14px 0;
            color: var(--muted);
            font-size: 0.75rem;
        }
        .contact-divider::before, .contact-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .agent-box {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px;
            background: var(--bg);
            border-radius: 10px;
            margin-top: 4px;
        }
        .agent-logo {
            width: 52px;
            height: 52px;
            border-radius: 10px;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.4rem;
            flex-shrink: 0;
        }
        .agent-name { font-weight: 700; font-size: 0.9rem; color: var(--primary); }
        .agent-tag {
            display: inline-block;
            font-size: 0.65rem;
            background: var(--secondary);
            color: #fff;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 600;
            margin-top: 3px;
        }

        /* quick info sidebar box */
        .quick-info {
            background: var(--card);
            border-radius: 14px;
            padding: 20px 24px;
            border: 1px solid var(--border);
        }
        .quick-info h4 {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--secondary);
            margin-bottom: 14px;
        }
        .qi-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }
        .qi-item:last-child { border-bottom: none; }
        .qi-label { color: var(--muted); font-weight: 500; }
        .qi-val { font-weight: 700; color: var(--text); text-align: right; }

        /* ── SIMILAR PROPERTIES ── */
        .similar-section { margin-top: 8px; }
        .similar-section h3 {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 18px;
        }
        .similar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        .sim-card {
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s;
        }
        .sim-card:hover { transform: translateY(-4px); box-shadow: 0 16px 32px rgba(0,43,92,0.12); }
        .sim-card img { width: 100%; height: 170px; object-fit: cover; display: block; }
        .sim-body { padding: 14px 16px; }
        .sim-price { font-size: 1.1rem; font-weight: 800; color: var(--secondary); margin-bottom: 4px; }
        .sim-title { font-size: 0.88rem; font-weight: 700; color: var(--primary); margin-bottom: 6px; line-height: 1.4; }
        .sim-meta { font-size: 0.78rem; color: var(--muted); }
        .sim-meta i { color: var(--secondary); margin-right: 3px; }

        /* ── NOT FOUND ── */
        .not-found {
            text-align: center;
            padding: 100px 24px;
        }
        .not-found i { font-size: 4rem; color: #ccc; margin-bottom: 20px; display: block; }
        .not-found h2 { font-size: 1.5rem; color: var(--primary); margin-bottom: 10px; }
        .not-found p { color: var(--muted); margin-bottom: 24px; }

        /* ── BADGE COLOR MAP ── */
        [data-badge="Hot Listing"] { background: #fef3c7; color: #92400e; }
        [data-badge="For Sale"]    { background: #dbeafe; color: #1e40af; }
        [data-badge="Commercial"]  { background: #d1fae5; color: #065f46; }
        [data-badge="Exclusive Deal"] { background: #ede9fe; color: #5b21b6; }
    </style>
</head>

//  RENDER
// ═══════════════════════════════════════════════
function getParam(key) {
    return new URLSearchParams(window.location.search).get(key);
}

function badgeClass(badge) {
    const map = { 'Hot Listing':'badge-hot','For Sale':'badge-sale','Commercial':'badge-comm','Exclusive Deal':'badge-exc' };
    return map[badge] || 'badge-sale';
}

function renderPage() {
    const id = getParam('id');
    const prop = PROPERTIES[id];
    const content = document.getElementById('page-content');

    if (!prop) {
        content.innerHTML = `
            <div class="not-found">
                <i class="fas fa-home"></i>
                <h2>Property Not Found</h2>
                <p>This listing may have been removed or the link is incorrect.</p>
                <a href="shabbir-memon-realtor.html" style="display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:#fff;padding:12px 28px;border-radius:10px;font-weight:700;">
                    <i class="fas fa-arrow-left"></i> Back to Listings
                </a>
            </div>`;
        return;
    }

    document.title = prop.title + ' – Shabbir Memon Realtor';

    // build similar cards
    const similarHTML = (prop.similar || []).map(sid => {
        const s = PROPERTIES[sid];
        if (!s) return '';
        return `<div class="sim-card" onclick="window.location.href='property-detail.html?id=${sid}'">
            <img src="${s.images[0]}" alt="${s.title}" loading="lazy">
            <div class="sim-body">
                <div class="sim-price">${s.price}</div>
                <div class="sim-title">${s.title}</div>
                <div class="sim-meta"><i class="fas fa-map-marker-alt"></i>${s.location}</div>
            </div>
        </div>`;
    }).join('');

    // build image thumbs
    const thumbsHTML = prop.images.map((img, i) =>
        `<div class="thumb ${i===0?'active':''}" onclick="switchImg(${i})" id="thumb-${i}">
            <img src="${img}" alt="Photo ${i+1}" loading="lazy">
        </div>`
    ).join('');

    // build details rows
    const detailsHTML = prop.details.map(([label, val]) =>
        `<div class="detail-row"><div>${label}</div><div>${val}</div></div>`
    ).join('');

    // build features
    const featuresHTML = prop.features.map(f =>
        `<div class="feature-item"><i class="fas ${f.icon}"></i>${f.label}</div>`
    ).join('');

    content.innerHTML = `
    <!-- BREADCRUMB -->
    <div class="breadcrumb">
        <a href="shabbir-memon-realtor.html">Home</a>
        <i class="fas fa-chevron-right"></i>
        <a href="shabbir-memon-realtor.html#properties">${prop.city}</a>
        <i class="fas fa-chevron-right"></i>
        <span>${prop.title}</span>
    </div>

    <div class="page-wrap">
        <!-- MAIN -->
        <div class="main-col">

            <!-- HEADER -->
            <div class="prop-header">
                <div class="prop-badge-row">
                    <span class="prop-badge ${badgeClass(prop.badge)}">${prop.badge}</span>
                    <span class="prop-badge" style="background:#f0fdf4;color:#15803d;">
                        <i class="fas fa-circle-check" style="margin-right:4px;font-size:0.7rem"></i>Verified Listing
                    </span>
                </div>
                <h1 class="prop-title">${prop.title}</h1>
                <div class="prop-location">
                    <i class="fas fa-map-marker-alt"></i>
                    ${prop.location}
                </div>
                <div class="prop-price-row">
                    <div class="prop-price">${prop.price}</div>
                    <div class="prop-stats">
                        ${prop.area !== 'Contact for Details' ? `<div class="stat-pill"><i class="fas fa-ruler-combined"></i>${prop.area}</div>` : ''}
                        ${prop.bedrooms !== '-' ? `<div class="stat-pill"><i class="fas fa-bed"></i>${prop.bedrooms} Bed</div>` : ''}
                        ${prop.bathrooms !== '-' ? `<div class="stat-pill"><i class="fas fa-bath"></i>${prop.bathrooms} Bath</div>` : ''}
                    </div>
                </div>
            </div>

            <!-- GALLERY -->
            <div class="gallery-card">
                <div class="gallery-main">
                    <img id="gallery-main-img" src="${prop.images[0]}" alt="${prop.title}">
                    ${prop.images.length > 1 ? `
                    <button class="gallery-arrow left" onclick="prevImg()"><i class="fas fa-chevron-left"></i></button>
                    <button class="gallery-arrow right" onclick="nextImg()"><i class="fas fa-chevron-right"></i></button>
                    <div class="gallery-counter" id="gallery-counter">1 / ${prop.images.length}</div>
                    ` : ''}
                </div>
                ${prop.images.length > 1 ? `<div class="gallery-thumbs">${thumbsHTML}</div>` : ''}
            </div>

            <!-- TABS -->
            <div class="tabs-bar">
                <div class="tabs-nav">
                    <button class="tab-btn active" onclick="switchTab('overview',this)">Overview</button>
                    <button class="tab-btn" onclick="switchTab('description',this)">Description</button>
                    <button class="tab-btn" onclick="switchTab('features',this)">Features & Amenities</button>
                </div>

                <!-- OVERVIEW TAB -->
                <div class="tab-content active" id="tab-overview">
                    <div class="details-label">Property Details</div>
                    <div class="details-grid">${detailsHTML}</div>
                </div>

                <!-- DESCRIPTION TAB -->
                <div class="tab-content" id="tab-description">
                    <div class="details-label">About This Property</div>
                    <div class="desc-text">${prop.description}</div>
                </div>

                <!-- FEATURES TAB -->
                <div class="tab-content" id="tab-features">
                    <div class="details-label">Features & Amenities</div>
                    <div class="features-grid">${featuresHTML}</div>
                </div>
            </div>

            <!-- SIMILAR -->
            ${similarHTML ? `<div class="similar-section">
                <h3>Similar Properties</h3>
                <div class="similar-grid">${similarHTML}</div>
            </div>` : ''}

        </div>

        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-sticky">

                <!-- CONTACT BOX -->
                <div class="contact-box">
                    <div class="contact-price">${prop.price}</div>
                    <div class="contact-added"><i class="fas fa-clock" style="margin-right:4px"></i>Added ${prop.added}</div>
                    <a href="https://wa.me/923332964231?text=${encodeURIComponent(prop.waMsg)}" target="_blank">
                        <button class="contact-btn btn-wa">
                            <i class="fab fa-whatsapp" style="font-size:1.2rem"></i> WhatsApp
                        </button>
                    </a>
                    <a href="tel:+923332964231">
                        <button class="contact-btn btn-call">
                            <i class="fas fa-phone-alt"></i> Call Now
                        </button>
                    </a>
                    <div class="contact-divider">or</div>
                    <div class="agent-box">
                        <div class="agent-logo"><i class="fas fa-user-tie"></i></div>
                        <div>
                            <div class="agent-name">Shabbir Memon</div>
                            <div class="agent-tag">Verified Agent</div>
                        </div>
                    </div>
                </div>

                <!-- QUICK INFO -->
                <div class="quick-info">
                    <h4>Quick Info</h4>
                    <div class="qi-item"><span class="qi-label">Type</span><span class="qi-val">${prop.type}</span></div>
                    <div class="qi-item"><span class="qi-label">Purpose</span><span class="qi-val">${prop.purpose}</span></div>
                    <div class="qi-item"><span class="qi-label">City</span><span class="qi-val">${prop.city}</span></div>
                    ${prop.area !== 'Contact for Details' ? `<div class="qi-item"><span class="qi-label">Area</span><span class="qi-val">${prop.area}</span></div>` : ''}
                    ${prop.bedrooms !== '-' ? `<div class="qi-item"><span class="qi-label">Bedrooms</span><span class="qi-val">${prop.bedrooms}</span></div>` : ''}
                </div>

            </div>
        </div>
    </div>`;

    // Init gallery state
    window._imgIdx = 0;
    window._imgCount = prop.images.length;
    window._images = prop.images;
}

// Gallery controls
function switchImg(idx) {
    window._imgIdx = idx;
    const img = document.getElementById('gallery-main-img');
    img.style.opacity = '0';
    setTimeout(() => { img.src = window._images[idx]; img.style.opacity = '1'; }, 200);
    const counter = document.getElementById('gallery-counter');
    if (counter) counter.textContent = `${idx+1} / ${window._imgCount}`;
    document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === idx));
}
function nextImg() { switchImg((window._imgIdx + 1) % window._imgCount); }
function prevImg() { switchImg((window._imgIdx - 1 + window._imgCount) % window._imgCount); }

// Tab controls
function switchTab(name, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    btn.classList.add('active');
}

// Run
renderPage();
</script>
